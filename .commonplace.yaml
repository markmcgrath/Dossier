# dossier-open-source allowlist for Commonplace Book auto-ingest
# Schema: Claude Stack/CommonplaceBook/features/plan/00-schema-allowlist.md

ingest_roots:
  - CLAUDE.md
  - README.md
  - features/plan/*.md
  - features/research/*.md

exclude:
  # Bare-filename ingest_roots (README.md) right-anchor on basename at any
  # depth via the scanner's Path.match fallback, so a single top-level
  # README.md pattern otherwise pulls READMEs from .pytest_cache/, examples/,
  # tests/, schemas/, features/. This excludes every *nested* README while
  # keeping the intended top-level one.
  - "*/README.md"

defaults:
  default_domain: dossier
  default_tags:
    - dossier
    - dossier-open-source
    - auto-ingest
  default_decay_class: slow
