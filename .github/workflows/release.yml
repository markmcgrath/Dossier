# Release workflow — packages the skill on every annotated v* tag push.
#
# Trigger: push of a tag matching v*.
#
# Steps:
#   1. Checkout at the tag (full history — needed for `git describe`).
#   2. Set up Python 3.12 and install deps from requirements.txt.
#   3. Run the full pytest suite as defense-in-depth. Aborts if any test
#      fails. Catches the corner case where a maintainer tags a commit that
#      did not pass CI (e.g., a long-lived branch tagged without going
#      through main's PR gates).
#   4. Run build_skill.sh to produce dist/dossier-<tag>.skill + .sha256.
#      The byte-match guard (exit 3) is inherited from build_skill.sh:
#      the freshly built bundle must be byte-identical to the committed
#      dossier.skill. Recovery: regenerate, commit dossier.skill, retag.
#   5. Verify the artifact via verify_skill_artifact.py (structural smoke:
#      valid ZIP, required entries present, manifest.json shape, etc.).
#   6. Awk-extract the CHANGELOG section matching the tag (## [<ver>] —),
#      with [Unreleased] fallback and a placeholder when both are absent.
#   7. Create a GitHub Release with both assets attached.
#
# Permissions: contents: write — minimum required for `gh release create`.
# Scoped to this workflow only; CI's contents: read is unchanged.
#
# This workflow is NOT a required status check (it cannot be — it runs on
# tag push, not PR/branch). Merge-time gates (pii-scan, test 3.11/3.12,
# changelog-check) cover that role.
#
# Cross-reference: features/plan/18-version-tag-release-pipeline.md (Stream C)
# Execution plan: ~/.claude/plans/lucky-pondering-dragon.md

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # create release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, test, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full tag history for `git describe`

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        env:
          DOSSIER_VAULT: ${{ github.workspace }}
        run: python -m pytest tests/ -v

      - name: Build skill artifact
        id: build
        run: |
          set -e
          bash .github/scripts/build_skill.sh
          # Locate the artifact for later steps.
          art="$(ls dist/dossier-*.skill | head -n 1)"
          sha="${art}.sha256"
          echo "artifact=${art}" >> "$GITHUB_OUTPUT"
          echo "checksum=${sha}" >> "$GITHUB_OUTPUT"
          echo "Built ${art}"

      - name: Verify artifact structure
        run: |
          set -e
          art="${{ steps.build.outputs.artifact }}"
          python .github/scripts/verify_skill_artifact.py "$art"
          echo "Artifact passed structural smoke verification."

      - name: Extract CHANGELOG section for tag
        id: notes
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          # Try to extract the section for the exact tag from CHANGELOG.md.
          # Handles both "## [1.1.0] — date" and "## 1.1.0 — date" forms.
          # If the tag has no section yet, fall back to [Unreleased].
          notes=""
          if grep -qE "^## \[?${tag#v}\]?" CHANGELOG.md; then
            notes="$(awk -v ver="${tag#v}" '
              $0 ~ "^## \\[?" ver "\\]?" { capture=1; next }
              capture && $0 ~ "^## " { exit }
              capture { print }
            ' CHANGELOG.md)"
          fi
          if [[ -z "$notes" ]]; then
            notes="$(awk '
              /^## \[Unreleased\]/ { capture=1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md)"
          fi
          # Stash to a file (preserves newlines for the gh CLI body).
          printf "%s\n" "$notes" > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "Tag ${tag} — no CHANGELOG section found; using a placeholder." > /tmp/release-notes.md
          fi
          echo "Wrote $(wc -l < /tmp/release-notes.md) line(s) of release notes."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            "${{ steps.build.outputs.artifact }}" \
            "${{ steps.build.outputs.checksum }}"
