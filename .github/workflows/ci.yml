name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DOSSIER_VAULT: ${{ github.workspace }}
        run: python -m pytest tests/ -v

  pii-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run PII scan
        run: python .github/scripts/pii_scan.py

  send-ready-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run send-ready scan
        run: python .github/scripts/sendready_scan.py

  changelog-check:
    name: changelog-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run CHANGELOG gate
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: |
          git fetch --no-tags --prune origin "${{ github.base_ref }}"
          bash .github/scripts/changelog_check.sh

  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Conventional Commits check
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: |
          git fetch --no-tags --prune origin "${{ github.base_ref }}"
          bash .github/scripts/check_conventional_commits.sh

  skill-parity:
    # Runs build_skill.sh on every PR and push to main. The build script exits
    # with code 3 if the freshly-built bundle's content drifts from the
    # committed dossier.skill (manifest.json excluded — see HARDENING.md §9).
    # Previously this guard only ran on tag pushes via release.yml, meaning a
    # contributor could edit skill/*.md without repacking and CI would still
    # greenlight the PR.
    name: skill-parity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build skill and verify content-match
        run: bash .github/scripts/build_skill.sh
